<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Varied Readings — David Nicholson</title>
<meta name="description" content="Varied Readings — paintings in pairs by David Nicholson. Phoenix Gallery, Lawrence, KS, April 2026.">
<link rel="canonical" href="https://davidnicholsonart.com/varied-readings.html">
<meta property="og:title" content="Varied Readings — David Nicholson">
<meta property="og:description" content="Work in pairs. Phoenix Gallery, Lawrence KS.">
<meta property="og:image" content="https://davidnicholsonart.com/og-image.jpg">
<link rel="icon" type="image/png" sizes="96x96" href="favicon96.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding-top: var(--nav-h);
}

/* NAV — matches site chrome */

@media (min-width: 701px) { footer { padding-left: 40px; padding-right: 40px; } }
@media (min-width: 1100px) { footer { padding-left: 60px; padding-right: 60px; } }

main {
  flex: 1;
  width: 100%;
  max-width: 780px;
  margin: 0 auto;
  padding: 0 40px;
  box-sizing: border-box;
}

.lead {
  margin: 48px 0 8px;
  text-align: center;
}
.show-title {
  font-size: clamp(26px, 5vw, 40px);
  font-weight: 700;
  letter-spacing: -0.01em;
  text-transform: lowercase;
  color: var(--ink);
  line-height: 1.15;
}
.show-meta {
  margin: 14px 0 0;
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 0.1em;
  text-transform: lowercase;
  color: var(--ink3);
  line-height: 1.7;
}
.show-meta a { color: var(--accent-ink); text-decoration: none; }
.lead p {
  font-size: 16px;
  font-weight: 300;
  line-height: 1.85;
  color: var(--ink2);
  margin-top: 20px;
}

.plates {
  margin: 56px 0 8px;
  display: flex;
  flex-direction: column;
  gap: 56px;
}
.plate {
  width: 100%;
  opacity: 0;
  transform: translateY(18px);
  animation: rise 1s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
}
.plate:nth-child(1) { animation-delay: 0.10s; }
.plate:nth-child(2) { animation-delay: 0.28s; }
.plate:nth-child(3) { animation-delay: 0.46s; }
.plate img {
  display: block;
  width: 100%;
  height: auto;
  background: #e7eaed;
}
@keyframes rise {
  to { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .plate { animation: none; opacity: 1; transform: none; }
}

/* FOOTER — full bleed, matches site chrome */
footer { border-top: 1px solid var(--border); margin-top: 64px; padding: 64px 20px 48px; }
.f-inner { max-width: 1200px; margin: 0 auto; }
.f-cols { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 40px; }
.f-brand { font-size: clamp(26px, 3vw, 36px); font-weight: 700; text-transform: lowercase; letter-spacing: -0.01em; }
.f-links { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.f-links a, .f-links button { font-size: 15px; font-weight: 400; text-transform: lowercase; color: var(--ink2); background: none; border: none; padding: 0; font-family: var(--font); cursor: pointer; transition: color 0.2s; text-decoration: none; display: inline-block; }
.f-links a:hover, .f-links button:hover { color: var(--ink); }
.f-legal { margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--ink3); letter-spacing: 0.06em; }

@media (max-width: 600px) {
  main { padding: 0 20px; }
  .lead { margin-top: 36px; }
  .show-title { font-size: 24px; }
  .plates { gap: 36px; margin-top: 44px; }
  footer { padding: 48px 20px 40px; }
}
</style>
<link rel="stylesheet" href="/site-tokens.css?v=2">
<link rel="stylesheet" href="/site-bar.css?v=5">
<link rel="stylesheet" href="/site-chrome.css?v=18">
</head>
<body>

<nav data-chrome-nav></nav>
<script src="/site-bar.js?v=5"></script>

<!-- SITE MENU -->
<div id="menu-scrim"></div>
<div id="menu-panel" aria-label="site menu"></div>

<main>
  <div class="lead">
    <h1 class="show-title">varied readings</h1>
    <div class="show-meta">april 24th &ndash; may 22nd, 2026<br><a href="https://www.phoenixgalleryart.com" target="_blank" rel="noopener">phoenix gallery &mdash; lawrence, ks</a></div>
    <p>Varied Readings presented work in pairs, each grouping an exploration of adjacent subject matter approached from shifting compositional and chromatic vantage points.</p>
  </div>

  <div class="plates">
    <figure class="plate">
      <img src="https://davidnicholsonart.com/4_26_varied_readings/1.jpeg" alt="Varied Readings at Phoenix Gallery, Lawrence, KS" loading="lazy">
    </figure>
    <figure class="plate">
      <img src="https://davidnicholsonart.com/4_26_varied_readings/2.jpeg" alt="Varied Readings at Phoenix Gallery, Lawrence, KS" loading="lazy">
    </figure>
    <figure class="plate">
      <img src="https://davidnicholsonart.com/4_26_varied_readings/3.jpeg" alt="Varied Readings at Phoenix Gallery, Lawrence, KS" loading="lazy">
    </figure>
  </div>
</main>

<footer>
  <div class="f-inner">
    <div class="f-cols">
      <div>
        <p class="f-brand">david nicholson</p>
        <img src="/logo-mark.png" alt="" style="height:40px;width:auto;display:block;margin-top:14px;">
      </div>
      <div class="f-links" data-chrome-footer></div>
    </div>
    <p class="f-legal">&copy; 2026 david nicholson</p>
  </div>
</footer>

<script>
/* cart badge — reads the same store the gallery writes to */
(function () {
  var n = 0;
  try { n = (JSON.parse(localStorage.getItem('dna_cart')) || []).length; } catch (e) {}
  var el = document.getElementById('cart-count');
  if (!el) return;
  el.textContent = n;
  el.classList.toggle('on', n > 0);
})();
</script>
<script src="/site-chrome.js?v=18"></script>
</body>
</html>
