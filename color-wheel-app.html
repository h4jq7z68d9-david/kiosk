<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>color wheel — david nicholson</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="96x96" href="favicon96.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wall:#ffffff; --wall-hi:#f4f6f8; --ink:#2b3640; --muted:#586470;
    --line:#dfe4e9; --card:#ffffff;
    --accent:#2f4f75; --accent-hi:#3d5f88;
    --display:'Jost',Futura,'Trebuchet MS',Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,'Segoe UI Mono',monospace;
    --body:'Jost',Futura,'Trebuchet MS',Arial,sans-serif;
    --shadow:0 1px 2px rgba(43,54,64,.08),0 18px 40px -14px rgba(43,54,64,.20);
  }
  *{box-sizing:border-box}
  html,body{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
  body{
    margin:0;background:radial-gradient(120% 90% at 50% -10%,var(--wall-hi),var(--wall) 60%);
    color:var(--ink);font-family:var(--body);
    display:flex;flex-direction:column;min-height:100dvh;
    -webkit-font-smoothing:antialiased;
  }

  header{display:flex;justify-content:space-between;align-items:baseline;padding:20px clamp(16px,4vw,40px) 0;gap:16px}
  .brand{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .brand b{color:var(--ink);font-weight:500}

  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:14px clamp(16px,4vw,40px) 20px;gap:16px}

  .stage{width:min(560px,92vw);display:flex;flex-direction:column;align-items:center;gap:14px}

  .wheel-frame{position:relative;width:min(380px,78vw);aspect-ratio:1/1;touch-action:none;cursor:grab}
  .wheel-frame:active{cursor:grabbing}
  .wheel-frame svg{width:100%;height:100%;overflow:visible}
  .wedge{cursor:pointer;transition:opacity .12s ease}
  .wedge:hover{opacity:.88}
  .needle{pointer-events:none}
  .needle .hub{fill:#fff;stroke:var(--ink);stroke-width:2.5}
  .needle .arm{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
  .needle .tip{fill:var(--ink);stroke:#fff;stroke-width:2}

  .readout{width:100%;background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:clamp(16px,3.6vw,22px);display:flex;flex-direction:column;gap:14px}
  .base-row{display:flex;align-items:center;gap:14px}
  .base-row .sw{width:56px;height:56px;border-radius:12px;border:1px solid rgba(0,0,0,.12);flex-shrink:0}
  .base-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  .base-name{font-family:var(--display);font-weight:700;font-size:clamp(20px,4.8vw,26px);letter-spacing:-.01em}
  .base-hex{font-family:var(--mono);font-size:12px;color:var(--muted)}

  .rel-row{display:flex;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
  .rel-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:100px;flex-shrink:0;line-height:1.3}
  .rel-chips{display:flex;gap:8px;flex-wrap:wrap;flex:1}
  .rel-chip{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:52px}
  .rel-chip .sq{width:34px;height:34px;border-radius:7px;border:1px solid rgba(0,0,0,.12)}
  .rel-chip .lbl{font-size:10px;font-weight:500;text-align:center;line-height:1.15;color:var(--ink)}

  footer{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:0 16px 22px;text-align:center}
  .tool-note{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);max-width:480px;line-height:1.6}

  @media (max-width:420px){
    .rel-label{width:78px;font-size:10px}
    .rel-chip{min-width:44px}
    .rel-chip .sq{width:28px;height:28px}
  }
</style>
</head>
<body>
  <header>
    <div class="brand"><b>color wheel</b> &nbsp;/&nbsp; reference</div>
  </header>

  <main>
    <div class="stage">
      <div class="wheel-frame" id="wheelFrame">
        <svg viewBox="-115 -115 230 230" id="wheelSvg"></svg>
      </div>

      <div class="readout" id="readout"></div>
    </div>
  </main>

  <footer>
    <div class="tool-note">Drag the needle around the wheel — or tap any hue directly — to see its relationships update live.</div>
  </footer>

<script>
const $ = s => document.querySelector(s);

/* Same 12-hue palette used throughout the flashcard deck, so the wheel and
   the cards always agree with each other. */
const HUES12 = [
  {name:"Red",          hex:"#E23B2E"},
  {name:"Red-Orange",   hex:"#E8602C"},
  {name:"Orange",       hex:"#F08A24"},
  {name:"Yellow-Orange",hex:"#F6B31E"},
  {name:"Yellow",       hex:"#EFCB1E"},
  {name:"Yellow-Green", hex:"#A6C523"},
  {name:"Green",        hex:"#3FA535"},
  {name:"Blue-Green",   hex:"#1E9E8A"},
  {name:"Blue",         hex:"#2E6DB4"},
  {name:"Blue-Violet",  hex:"#4B4BA8"},
  {name:"Violet",       hex:"#7B4BA0"},
  {name:"Red-Violet",   hex:"#B23A78"},
];

let rotation = 0; // degrees, needle angle (0 = north/Red, clockwise positive)

function polar(cx, cy, r, deg){
  const rad = (deg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
}
function wedgePath(r0, r1, a0, a1){
  const [x0,y0] = polar(0,0,r1,a0), [x1,y1] = polar(0,0,r1,a1);
  const [x2,y2] = polar(0,0,r0,a1), [x3,y3] = polar(0,0,r0,a0);
  const large = (a1 - a0) > 180 ? 1 : 0;
  return `M ${x0} ${y0} A ${r1} ${r1} 0 ${large} 1 ${x1} ${y1} L ${x2} ${y2} A ${r0} ${r0} 0 ${large} 0 ${x3} ${y3} Z`;
}
/* Pointer position -> angle in the same convention as the wedges (0 = north,
   clockwise positive), so drag rotation and wedge geometry always agree. */
function pointerAngle(cx, cy, px, py){
  const dx = px - cx, dy = py - cy;
  return (Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360;
}
function shortestDelta(a, b){
  let d = (b - a) % 360;
  if (d > 180) d -= 360;
  if (d < -180) d += 360;
  return d;
}
function hueAtOffset(offset){
  const idx = Math.floor((((offset*30 + rotation) % 360) + 360) % 360 / 30) % 12;
  return HUES12[idx];
}

const RELATIONSHIPS = [
  { label: "Complementary", offsets: [6] },
  { label: "Analogous",     offsets: [-1, 1] },
  { label: "Triadic",       offsets: [4, 8] },
  { label: "Split-Comp.",   offsets: [5, 7] },
  { label: "Tetradic",      offsets: [3, 6, 9] },
];

function renderWheel(){
  const svg = $('#wheelSvg');
  const step = 30;
  const wedges = HUES12.map((hue, idx) => {
    const a0 = idx * step, a1 = a0 + step;
    return `<path class="wedge" data-i="${idx}" d="${wedgePath(30,100,a0,a1)}" fill="${hue.hex}" stroke="#fff" stroke-width="1.5"></path>`;
  }).join('');
  svg.innerHTML = `
    <g id="wheelBase">${wedges}</g>
    <g id="needleGroup" class="needle" style="transform:rotate(${rotation}deg)">
      <line class="arm" x1="0" y1="0" x2="0" y2="-95"></line>
      <circle class="tip" r="7" cx="0" cy="-95"></circle>
      <circle class="hub" r="11" cx="0" cy="0"></circle>
    </g>`;
  svg.querySelectorAll('.wedge').forEach(el => {
    el.addEventListener('click', () => {
      rotation = parseInt(el.dataset.i, 10) * 30 + 15;
      $('#needleGroup').style.transform = `rotate(${rotation}deg)`;
      updateReadout();
    });
  });
  attachDrag();
  updateReadout();
}

function chipHtml(hue){
  return `
    <div class="rel-chip">
      <div class="sq" style="background:${hue.hex}"></div>
      <div class="lbl">${hue.name}</div>
    </div>`;
}
function updateReadout(){
  const base = hueAtOffset(0);
  const rows = RELATIONSHIPS.map(rel => {
    const chips = rel.offsets.map(o => chipHtml(hueAtOffset(o))).join('');
    return `
      <div class="rel-row">
        <div class="rel-label">${rel.label}</div>
        <div class="rel-chips">${chips}</div>
      </div>`;
  }).join('');
  $('#readout').innerHTML = `
    <div class="base-row">
      <div class="sw" style="background:${base.hex}"></div>
      <div>
        <div class="base-eyebrow">Base hue</div>
        <div class="base-name">${base.name}</div>
        <div class="base-hex">${base.hex}</div>
      </div>
    </div>
    ${rows}`;
}

/* ---- drag to spin the needle ---- */
let dragging = false, dragStartPointer = 0, dragStartRotation = 0;
function attachDrag(){
  const frame = $('#wheelFrame');
  if (frame.dataset.bound) return;
  frame.dataset.bound = '1';
  frame.addEventListener('pointerdown', e => {
    dragging = true;
    frame.setPointerCapture(e.pointerId);
    const rect = frame.getBoundingClientRect();
    const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    dragStartPointer = pointerAngle(cx, cy, e.clientX, e.clientY);
    dragStartRotation = rotation;
  });
  frame.addEventListener('pointermove', e => {
    if (!dragging) return;
    const rect = frame.getBoundingClientRect();
    const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    const cur = pointerAngle(cx, cy, e.clientX, e.clientY);
    const delta = shortestDelta(dragStartPointer, cur);
    let next = (dragStartRotation + delta + 360) % 360;
    // Light magnetic snap to the 12 named hues (every 30°).
    const nearest = Math.round(next / 30) * 30;
    if (Math.abs(shortestDelta(next, nearest)) < 4) next = nearest % 360;
    rotation = next;
    $('#needleGroup').style.transform = `rotate(${rotation}deg)`;
    updateReadout();
  });
  const stop = () => { dragging = false; };
  frame.addEventListener('pointerup', stop);
  frame.addEventListener('pointercancel', stop);
}

renderWheel();
</script>
</body>
</html>
