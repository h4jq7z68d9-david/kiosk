<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>color wheel — david nicholson</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="96x96" href="favicon96.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wall:#ffffff; --wall-hi:#f4f6f8; --ink:#2b3640; --muted:#586470;
    --line:#dfe4e9; --card:#ffffff;
    --accent:#2f4f75; --accent-hi:#3d5f88;
    --display:'Jost',Futura,'Trebuchet MS',Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,'Segoe UI Mono',monospace;
    --body:'Jost',Futura,'Trebuchet MS',Arial,sans-serif;
    --shadow:0 1px 2px rgba(43,54,64,.08),0 18px 40px -14px rgba(43,54,64,.20);
  }
  *{box-sizing:border-box}
  html,body{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
  body{
    margin:0;background:radial-gradient(120% 90% at 50% -10%,var(--wall-hi),var(--wall) 60%);
    color:var(--ink);font-family:var(--body);
    display:flex;flex-direction:column;min-height:100dvh;
    -webkit-font-smoothing:antialiased;
  }

  header{display:flex;justify-content:space-between;align-items:baseline;padding:14px clamp(16px,4vw,40px) 0;gap:16px}
  .brand{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .brand b{color:var(--ink);font-weight:500}

  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:10px clamp(16px,4vw,40px) 16px;gap:12px}

  .stage{width:min(560px,92vw);display:flex;flex-direction:column;align-items:center;gap:12px}

  .wheel-frame{position:relative;width:min(320px,66vw);aspect-ratio:1/1;touch-action:none;cursor:grab}
  .wheel-frame:active{cursor:grabbing}
  .wheel-frame svg{width:100%;height:100%;overflow:visible}
  .wedge{cursor:pointer;transition:opacity .12s ease,stroke .15s ease,stroke-width .15s ease}
  .wedge:hover{opacity:.88}
  .tick{stroke:rgba(43,54,64,.28);stroke-width:1.5}
  .needle{pointer-events:none;filter:drop-shadow(0 3px 4px rgba(43,54,64,.35))}
  .needle .hub-ring{fill:#fff;stroke:var(--ink);stroke-width:2.5}
  .needle .hub-dot{fill:var(--ink)}
  .needle .arm{fill:var(--ink)}

  .readout{width:100%;background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:clamp(14px,3.2vw,20px);display:flex;flex-direction:column;gap:10px}

  .rel-row{display:flex;align-items:center;gap:10px;padding-top:9px;border-top:1px solid var(--line)}
  .rel-row:first-child{padding-top:0;border-top:none}
  .rel-label{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);width:88px;flex-shrink:0;line-height:1.25}
  .rel-chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
  .rel-chip{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:42px}
  .rel-chip .sq{width:28px;height:28px;border-radius:6px;border:1px solid rgba(0,0,0,.12)}
  .rel-chip .lbl{font-size:9px;font-weight:500;text-align:center;line-height:1.1;color:var(--ink)}

  footer{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:0 16px 16px;text-align:center}
  .tool-note{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--muted);max-width:480px;line-height:1.5}

  @media (max-width:420px){
    .wheel-frame{width:min(260px,60vw)}
    .rel-label{width:72px;font-size:9.5px}
    .rel-chip{min-width:38px}
    .rel-chip .sq{width:24px;height:24px}
  }
</style>
</head>
<body>
  <header>
    <div class="brand"><b>color wheel</b> &nbsp;/&nbsp; reference</div>
  </header>

  <main>
    <div class="stage">
      <div class="wheel-frame" id="wheelFrame">
        <svg viewBox="-115 -115 230 230" id="wheelSvg"></svg>
      </div>

      <div class="readout" id="readout"></div>
    </div>
  </main>

  <footer>
    <div class="tool-note">Drag the needle around the wheel — or tap any hue directly — to see its relationships update live.</div>
  </footer>

<script>
const $ = s => document.querySelector(s);

/* Same 12-hue palette used throughout the flashcard deck, so the wheel and
   the cards always agree with each other. */
const HUES12 = [
  {name:"Red",          hex:"#E23B2E"},
  {name:"Red-Orange",   hex:"#E8602C"},
  {name:"Orange",       hex:"#F08A24"},
  {name:"Yellow-Orange",hex:"#F6B31E"},
  {name:"Yellow",       hex:"#EFCB1E"},
  {name:"Yellow-Green", hex:"#A6C523"},
  {name:"Green",        hex:"#3FA535"},
  {name:"Blue-Green",   hex:"#1E9E8A"},
  {name:"Blue",         hex:"#2E6DB4"},
  {name:"Blue-Violet",  hex:"#4B4BA8"},
  {name:"Violet",       hex:"#7B4BA0"},
  {name:"Red-Violet",   hex:"#B23A78"},
];

let rotation = 0; // degrees, needle angle (0 = north/Red, clockwise positive)

function polar(cx, cy, r, deg){
  const rad = (deg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
}
function wedgePath(r0, r1, a0, a1){
  const [x0,y0] = polar(0,0,r1,a0), [x1,y1] = polar(0,0,r1,a1);
  const [x2,y2] = polar(0,0,r0,a1), [x3,y3] = polar(0,0,r0,a0);
  const large = (a1 - a0) > 180 ? 1 : 0;
  return `M ${x0} ${y0} A ${r1} ${r1} 0 ${large} 1 ${x1} ${y1} L ${x2} ${y2} A ${r0} ${r0} 0 ${large} 0 ${x3} ${y3} Z`;
}
/* Pointer position -> angle in the same convention as the wedges (0 = north,
   clockwise positive), so drag rotation and wedge geometry always agree. */
function pointerAngle(cx, cy, px, py){
  const dx = px - cx, dy = py - cy;
  return (Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360;
}
function shortestDelta(a, b){
  let d = (b - a) % 360;
  if (d > 180) d -= 360;
  if (d < -180) d += 360;
  return d;
}
function hueAtOffset(offset){
  const idx = Math.floor((((offset*30 + rotation) % 360) + 360) % 360 / 30) % 12;
  return HUES12[idx];
}

const RELATIONSHIPS = [
  { label: "Complementary", offsets: [0, 6] },
  { label: "Analogous",     offsets: [-1, 0, 1] },
  { label: "Triadic",       offsets: [0, 4, 8] },
  { label: "Split-Comp.",   offsets: [0, 5, 7] },
  { label: "Tetradic",      offsets: [0, 3, 6, 9] },
];

function tickMarks(){
  return Array.from({length:12}, (_, i) => {
    const a = i * 30;
    const [x0,y0] = polar(0,0,101,a), [x1,y1] = polar(0,0,109,a);
    return `<line class="tick" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}"></line>`;
  }).join('');
}
function renderWheel(){
  const svg = $('#wheelSvg');
  const step = 30;
  const wedges = HUES12.map((hue, idx) => {
    const a0 = idx * step, a1 = a0 + step;
    return `<path class="wedge" data-i="${idx}" d="${wedgePath(30,100,a0,a1)}" fill="${hue.hex}" stroke="#fff" stroke-width="1.5"></path>`;
  }).join('');
  svg.innerHTML = `
    <g id="wheelBase">${wedges}</g>
    ${tickMarks()}
    <g id="needleGroup" class="needle" style="transform:rotate(${rotation}deg)">
      <path class="arm" d="M -4,-6 L 0,-92 L 4,-6 Z"></path>
      <circle class="hub-ring" r="12" cx="0" cy="0"></circle>
      <circle class="hub-dot" r="4" cx="0" cy="0"></circle>
    </g>`;
  attachDrag();
  updateReadout();
}

function updateActiveWedge(){
  const activeIdx = Math.floor((((rotation % 360) + 360) % 360) / 30) % 12;
  $('#wheelSvg').querySelectorAll('.wedge').forEach(el => {
    const isActive = parseInt(el.dataset.i, 10) === activeIdx;
    el.setAttribute('stroke', isActive ? 'var(--ink)' : '#fff');
    el.setAttribute('stroke-width', isActive ? '3' : '1.5');
  });
}

function chipHtml(hue){
  return `
    <div class="rel-chip">
      <div class="sq" style="background:${hue.hex}"></div>
      <div class="lbl">${hue.name}</div>
    </div>`;
}
function updateReadout(){
  updateActiveWedge();
  const rows = RELATIONSHIPS.map(rel => {
    const chips = rel.offsets.map(o => chipHtml(hueAtOffset(o))).join('');
    return `
      <div class="rel-row">
        <div class="rel-label">${rel.label}</div>
        <div class="rel-chips">${chips}</div>
      </div>`;
  }).join('');
  $('#readout').innerHTML = rows;
}

/* ---- drag to spin the needle, or tap a wedge directly ----
   Both gestures go through the same pointer events (rather than mixing
   setPointerCapture-based dragging with separate <path> click listeners) —
   pointer capture on the frame can swallow the click that would otherwise
   land on a child wedge, which is exactly what broke mouse taps before. */
let dragging = false, dragMoved = false, dragStartPointer = 0, dragStartRotation = 0;
function attachDrag(){
  const frame = $('#wheelFrame');
  if (frame.dataset.bound) return;
  frame.dataset.bound = '1';
  frame.addEventListener('pointerdown', e => {
    dragging = true;
    dragMoved = false;
    frame.setPointerCapture(e.pointerId);
    const rect = frame.getBoundingClientRect();
    const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    dragStartPointer = pointerAngle(cx, cy, e.clientX, e.clientY);
    dragStartRotation = rotation;
  });
  frame.addEventListener('pointermove', e => {
    if (!dragging) return;
    const rect = frame.getBoundingClientRect();
    const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    const cur = pointerAngle(cx, cy, e.clientX, e.clientY);
    const delta = shortestDelta(dragStartPointer, cur);
    if (Math.abs(delta) > 2) dragMoved = true;
    let next = (dragStartRotation + delta + 360) % 360;
    // Light magnetic snap to the 12 named hues (every 30°).
    const nearest = Math.round(next / 30) * 30;
    if (Math.abs(shortestDelta(next, nearest)) < 4) next = nearest % 360;
    rotation = next;
    $('#needleGroup').style.transform = `rotate(${rotation}deg)`;
    updateReadout();
  });
  frame.addEventListener('pointerup', e => {
    if (dragging && !dragMoved) {
      // A tap rather than a drag — jump straight to whichever wedge was hit.
      const rect = frame.getBoundingClientRect();
      const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
      const scale = rect.width / 230; // svg viewBox units -> pixels
      const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
      if (dist <= 100 * scale * 1.08) {
        const idx = Math.floor(dragStartPointer / 30) % 12;
        rotation = idx * 30 + 15;
        $('#needleGroup').style.transform = `rotate(${rotation}deg)`;
        updateReadout();
      }
    }
    dragging = false;
  });
  frame.addEventListener('pointercancel', () => { dragging = false; });
}

renderWheel();
</script>
</body>
</html>
