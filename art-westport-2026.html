<style>

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font);
  font-weight: 300; -webkit-font-smoothing: antialiased;
  min-height: 100vh; display: flex; flex-direction: column; padding-top: var(--nav-h);
}

@media (min-width: 701px) { footer { padding-left: 40px; padding-right: 40px; } }
@media (min-width: 1100px) { footer { padding-left: 60px; padding-right: 60px; } }

main { flex: 1; width: 100%; max-width: 780px; margin: 0 auto; padding: 0 40px; box-sizing: border-box; }
.lead { margin: 48px 0 8px; text-align: center; }
.show-title { font-size: clamp(26px, 5vw, 40px); font-weight: 700; letter-spacing: -0.01em; text-transform: lowercase; color: var(--ink); line-height: 1.15; }
.show-meta { margin: 14px 0 0; font-size: 14px; font-weight: 400; letter-spacing: 0.1em; text-transform: lowercase; color: var(--ink3); line-height: 1.7; }
.plates { margin: 56px 0 8px; display: flex; flex-direction: column; gap: 56px; }
.plate { width: 100%; opacity: 0; transform: translateY(18px); animation: rise 1s cubic-bezier(0.22, 0.61, 0.36, 1) forwards; }
.plate:nth-child(1) { animation-delay: 0.10s; }
.plate:nth-child(2) { animation-delay: 0.28s; }
.plate:nth-child(3) { animation-delay: 0.46s; }
.plate:nth-child(4) { animation-delay: 0.64s; }
.plate img { display: block; width: 100%; height: auto; background: #e7eaed; }
@keyframes rise { to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) { .plate { animation: none; opacity: 1; transform: none; } }
footer { border-top: 1px solid var(--border); margin-top: 64px; padding: 64px 20px 48px; }
.f-inner { max-width: 1200px; margin: 0 auto; }
.f-cols { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 40px; }
.f-brand { font-size: clamp(26px, 3vw, 36px); font-weight: 700; text-transform: lowercase; letter-spacing: -0.01em; }
.f-links { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.f-links a, .f-links button { font-size: 15px; font-weight: 400; text-transform: lowercase; color: var(--ink2); background: none; border: none; padding: 0; font-family: var(--font); cursor: pointer; transition: color 0.2s; text-decoration: none; display: inline-block; }
.f-links a:hover, .f-links button:hover { color: var(--ink); }
.f-legal { margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--ink3); letter-spacing: 0.06em; }
@media (max-width: 600px) {
  main { padding: 0 20px; }
  .lead { margin-top: 36px; }
  .show-title { font-size: 24px; }
  .plates { gap: 36px; margin-top: 44px; }
  footer { padding: 48px 20px 40px; }
}
</style>
<link rel="stylesheet" href="/site-tokens.css?v=2">

</main>

<footer>

    </div>
    <p class="f-legal">&copy; 2026 david nicholson</p>

<script>
/* cart badge — reads the same store the gallery writes to */
(function () {
  var n = 0;
  try { n = (JSON.parse(localStorage.getItem('dna_cart')) || []).length; } catch (e) {}
  var el = document.getElementById('cart-count');
  if (!el) return;
  el.textContent = n;
  el.classList.toggle('on', n > 0);
})();
</script>
