<style>
:root {
  --bg: #ffffff; --surface: #eef1f4; --border: #dfe4e9; --border-mid: #cfd6dd;
  --ink: #2b3640; --ink2: #586470; --ink3: #697480;
  --accent: #2f4f75; --accent-hi: #3d5f88; --accent-ink: #33557d;
  --font: 'Jost', Futura, 'Trebuchet MS', Arial, sans-serif; --nav-h: 62px;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding-top: var(--nav-h);
}

/* NAV — matches site chrome */
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 80; height: var(--nav-h); background: rgba(255,255,255,0.94); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 0 20px; display: flex; align-items: center; gap: 12px; }
@media (min-width: 701px) { nav { padding: 0 40px; } footer { padding-left: 40px; padding-right: 40px; } }
@media (min-width: 1100px) { nav { padding: 0 60px; } footer { padding-left: 60px; padding-right: 60px; } }
.nav-title { font-size: 19px; font-weight: 500; color: var(--ink); letter-spacing: 0.05em; text-transform: lowercase; white-space: nowrap; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-decoration: none; display: flex; align-items: center; height: 100%; }
.nav-cart { position: relative; background: none; border: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; text-decoration: none; }
.nav-cart svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav-cart-count { position: absolute; top: -5px; right: -5px; background: var(--accent); color: #fff; border-radius: 20px; font-size: 10px; font-weight: 600; padding: 1px 5px; display: none; min-width: 18px; text-align: center; }
.nav-cart-count.on { display: block; }
.nav-links { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.nav-btn { background: var(--accent); border: 1px solid var(--accent); border-radius: 22px; padding: 12px 26px; font-family: var(--font); font-size: 13px; font-weight: 500; letter-spacing: 0.12em; text-transform: lowercase; color: #fff; cursor: pointer; white-space: nowrap; transition: background 0.2s, border-color 0.2s; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; min-height: 44px; box-sizing: border-box; }
.nav-btn:hover { background: var(--accent-hi); border-color: var(--accent-hi); }
@media (max-width: 700px) { .nav-title { font-size: 17px; } }
@media (max-width: 500px) {
  .nav-title { font-size: 14px; letter-spacing: 0.03em; }
  .nav-btn { font-size: 11px; padding: 10px 22px; letter-spacing: 0.08em; min-height: 44px; }
  .nav-btn .btn-text-long { display: none; }
  .nav-btn .btn-text-short { display: inline; }
}
@media (min-width: 501px) { .btn-text-short { display: none; } }

main { flex: 1; width: 100%; display: flex; flex-direction: column; }

/* intro */
.lead { width: 100%; max-width: 780px; margin: 0 auto; padding: 48px 40px 0; text-align: center; }
.show-title { font-size: clamp(26px, 5vw, 40px); font-weight: 700; letter-spacing: -0.01em; text-transform: lowercase; color: var(--ink); line-height: 1.15; }
.lead p { font-size: 16px; font-weight: 300; line-height: 1.8; color: var(--ink2); margin-top: 18px; }

/* section toggle */
.ct-toggle { display: flex; justify-content: center; gap: 8px; margin: 28px auto 0; }
.ct-toggle-btn { font-family: var(--font); font-size: 13px; font-weight: 500; letter-spacing: 0.04em; text-transform: lowercase; cursor: pointer; border: 1.5px solid var(--border-mid); background: #fff; color: var(--ink2); border-radius: 999px; padding: 10px 22px; transition: background 0.15s, border-color 0.15s, color 0.15s; }
.ct-toggle-btn:hover { border-color: var(--accent); color: var(--accent-ink); }
.ct-toggle-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* deck frame */
.deck-wrap { width: 100%; max-width: 880px; margin: 20px auto 8px; padding: 0 20px; }
.deck-wrap.hidden { display: none; }
.deck { width: 100%; height: 740px; min-height: 700px; border: 1px solid var(--border); border-radius: 12px; background: #fff; display: block; }
.wheel-deck { height: 780px; min-height: 740px; }

/* FOOTER — full bleed, matches site chrome */
footer { border-top: 1px solid var(--border); margin-top: 64px; padding: 64px 20px 48px; }
.f-inner { max-width: 1200px; margin: 0 auto; }
.f-cols { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 40px; }
.f-brand { font-size: clamp(26px, 3vw, 36px); font-weight: 700; text-transform: lowercase; letter-spacing: -0.01em; }
.f-links { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.f-links a, .f-links button { font-size: 15px; font-weight: 400; text-transform: lowercase; color: var(--ink2); background: none; border: none; padding: 0; font-family: var(--font); cursor: pointer; transition: color 0.2s; text-decoration: none; display: inline-block; }
.f-links a:hover, .f-links button:hover { color: var(--ink); }
.f-legal { margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--ink3); letter-spacing: 0.06em; }

@media (max-width: 600px) {
  .lead { padding: 36px 20px 0; }
  .show-title { font-size: 24px; }
  .deck-wrap { padding: 0 12px; margin-top: 16px; }
  /* Tall enough to show the whole app (taller card + choices + controls)
     without the iframe scrolling internally. */
  .deck { height: 860px; min-height: 860px; border-radius: 10px; }
  .wheel-deck { height: 720px; min-height: 720px; }
  .ct-toggle-btn { padding: 9px 16px; font-size: 12px; }
  footer { padding: 48px 20px 40px; }
}

/* GUESTBOOK MODAL */
#gb-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); visibility: hidden; opacity: 0; transition: opacity 0.28s, visibility 0s linear 0.28s; display: flex; align-items: center; justify-content: center; padding: 24px; }
#gb-overlay.on { visibility: visible; opacity: 1; transition: opacity 0.28s, visibility 0s; }
#gb-sheet { background: #ffffff; border-radius: 16px; width: 100%; max-width: 500px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 32px 80px rgba(0,0,0,0.7); }
.gb-header { display: flex; align-items: center; padding: 26px 26px 14px; flex-shrink: 0; gap: 10px; }
.gb-header h2 { font-size: 22px; font-weight: 400; letter-spacing: 0.01em; text-transform: lowercase; color: #2b3640; flex: 1; margin-bottom: 0; }
.gb-close { width: 30px; height: 30px; border-radius: 50%; background: rgba(0,0,0,0.07); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #697480; }
.gb-scroll { flex: 1; overflow-y: auto; padding: 0 26px 32px; display: flex; flex-direction: column; gap: 14px; }
.gb-scroll::-webkit-scrollbar { width: 0; }
.gb-form { display: flex; flex-direction: column; gap: 12px; }
.gb-label { font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: lowercase; color: #697480; margin-bottom: 5px; display: block; }
.gb-input, .gb-ta { background: rgba(255,255,255,0.7); border: 1.5px solid rgba(0,0,0,0.1); border-radius: 6px; color: #2b3640; font-family: var(--font); font-size: 16px; padding: 12px 14px; outline: none; width: 100%; transition: border-color 0.2s; -webkit-appearance: none; }
.gb-input:focus, .gb-ta:focus { border-color: #aab2b9; background: #fff; }
.gb-input::placeholder, .gb-ta::placeholder { color: #a4adb4; }
.gb-ta { resize: none; min-height: 86px; line-height: 1.5; }
.gb-submit { background: var(--accent); border: none; border-radius: 10px; color: #fff; padding: 15px; font-family: var(--font); font-size: 15px; font-weight: 500; letter-spacing: 0.02em; text-transform: lowercase; cursor: pointer; width: 100%; margin-top: 4px; transition: opacity 0.15s; }
.gb-submit:hover { opacity: 0.85; }

/* TOAST */
#toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(8px); background: var(--ink); color: #f1f3f5; font-family: var(--font); font-size: 12px; font-weight: 500; padding: 9px 18px; border-radius: 20px; opacity: 0; pointer-events: none; z-index: 300; white-space: nowrap; transition: opacity 0.2s, transform 0.2s; }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

<nav>

  <div class="nav-links">
    <a class="nav-btn" href="https://instagram.com/dave_nichol_son" target="_blank" rel="noopener"><span class="btn-text-long">follow on instagram</span><span class="btn-text-short">instagram</span></a>

<main>

<!-- GUESTBOOK MODAL -->
<div id="gb-overlay" onclick="gbOverlayClick(event)">
  <div id="gb-sheet">
    <div class="gb-header">
      <h2>guest book</h2>
      <button class="gb-close" onclick="closeGB()">&#x2715;</button>
    </div>
    <div class="gb-scroll">
      <div class="gb-form">
        <div><label class="gb-label" for="g-name">name</label><input class="gb-input" id="g-name" type="text" placeholder="Your name" autocomplete="off" autocorrect="off" spellcheck="false"></div>
        <div><label class="gb-label" for="g-email">email</label><input class="gb-input" id="g-email" type="email" placeholder="your@email.com" autocomplete="off" autocapitalize="none" spellcheck="false"></div>
        <div><label class="gb-label" for="g-msg">note <span style="font-weight:300;text-transform:none;letter-spacing:0;color:#aab2b9">(optional)</span></label><textarea class="gb-ta" id="g-msg" placeholder="Favourite piece, what brought you here&hellip;" spellcheck="false"></textarea></div>
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;">
          <input id="g-subscribe" type="checkbox" style="width:17px;height:17px;flex-shrink:0;accent-color:#2b3640;cursor:pointer;">
          <span style="font-size:12px;color:#697480;letter-spacing:0.04em;line-height:1.4;">casually stay informed &mdash; occasional notes on new work &amp; upcoming events</span>
        </label>
        <button class="gb-submit" id="gb-submit-btn" onclick="submitGB()">sign the guest book</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* cart badge — reads the same store the gallery writes to */
(function () {
  var n = 0;
  try { n = (JSON.parse(localStorage.getItem('dna_cart')) || []).length; } catch (e) {}
  var el = document.getElementById('cart-count');
  if (!el) return;
  el.textContent = n;
  el.classList.toggle('on', n > 0);
})();

/* color wheel / flashcards toggle — wheel loads eagerly (it's the default
   view now); flashcards iframe loads lazily on first switch to it */
function ctShow(which) {
  document.getElementById('ct-wheel-btn').classList.toggle('active', which === 'wheel');
  document.getElementById('ct-cards-btn').classList.toggle('active', which === 'cards');
  document.getElementById('ct-wheel-wrap').classList.toggle('hidden', which !== 'wheel');
  document.getElementById('ct-cards-wrap').classList.toggle('hidden', which !== 'cards');
  if (which === 'cards') {
    var frame = document.getElementById('ct-cards-frame');
    if (!frame.src) frame.src = '/color-theory-app.html';
  }
}

/* The wheel app's own content height isn't fixed — it grows and shrinks as
   the mixer adds colors, relationships expand, or the palette fills up —
   and it needs noticeably more room at desktop width (where its layout
   caps out at a fixed max-width rather than shrinking with the viewport)
   than at phone width. A fixed CSS height for the iframe means picking one
   number that's wrong for some screen or some state. Since both pages are
   same-origin, the parent can just read the iframe's real content height
   and match it directly, so the box is always exactly tall enough and
   never needs its own internal scrollbar. Falls back to the CSS height
   above if same-origin access ever fails for some reason. */
(function () {
  var frame = document.querySelector('.wheel-deck');
  if (!frame) return;
  function fitToContent() {
    try {
      var doc = frame.contentDocument;
      if (!doc || !doc.documentElement) return;
      // The wheel app's own body has min-height:100dvh, measured against
      // the iframe's current height — so measuring without collapsing
      // first would just echo back whatever height we last set, and the
      // iframe could grow but never shrink back down (e.g. after
      // collapsing an expanded flashcard). Collapse first so the
      // measurement reflects the content's true natural height.
      frame.style.height = '0px';
      // Read scrollHeight one frame later, not synchronously. Collapsing
      // to 0px and immediately reading back can catch mobile Safari
      // mid-reflow and return a too-small number, which — combined with
      // the child page no longer scrolling internally (see
      // color-wheel-app.html) — used to clip the bottom of the app
      // instead of just growing the box. A couple of px of slack is added
      // on top for the same reason: better a hair of empty space than a
      // clipped control.
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          var h = doc.documentElement.scrollHeight;
          frame.style.height = (h > 0 ? h + 4 : 700) + 'px';
        });
      });
    } catch (err) { /* not same-origin for some reason — CSS fallback height stays */ }
  }
  frame.addEventListener('load', function () {
    fitToContent();
    try {
      new ResizeObserver(fitToContent).observe(frame.contentDocument.documentElement);
    } catch (err) {}
  });
})();

/* Chrome/Android can fire its own native "Add to Home Screen" mini-prompt
   for installable pages. Suppress it outright — no custom banner, no
   native fallback either. */
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); });

/* GUESTBOOK */
const LAMBDA = 'https://doqg3wcta7.execute-api.us-east-1.amazonaws.com';

let gbSubmitting = false;
function openGB() { document.getElementById('gb-overlay').classList.add('on'); }
function closeGB() { document.getElementById('gb-overlay').classList.remove('on'); }
function gbOverlayClick(e) { if (e.target === document.getElementById('gb-overlay')) closeGB(); }

async function submitGB() {
  if (gbSubmitting) return;
  const name       = document.getElementById('g-name').value.trim();
  const email      = document.getElementById('g-email').value.trim();
  const note       = document.getElementById('g-msg').value.trim();
  const subscribed = document.getElementById('g-subscribe').checked;
  if (!name)                          { toast('please enter your name'); return; }
  if (!email || !email.includes('@')) { toast('please enter a valid email'); return; }
  gbSubmitting = true;
  const btn = document.getElementById('gb-submit-btn');
  btn.textContent = 'signing…'; btn.style.opacity = '0.6';
  try {
    const r = await fetch(LAMBDA + '/guestbook', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, note, subscribed }),
    });
    if (!r.ok) throw 0;
    document.getElementById('g-name').value = '';
    document.getElementById('g-email').value = '';
    document.getElementById('g-msg').value = '';
    document.getElementById('g-subscribe').checked = false;
    toast('thanks for signing!');
    setTimeout(closeGB, 1200);
  } catch {
    toast('something went wrong — try again');
  } finally {
    gbSubmitting = false;
    btn.textContent = 'sign the guest book'; btn.style.opacity = '';
  }
}

let toastTimer;
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 2800); }
</script>
</body>
</html>
