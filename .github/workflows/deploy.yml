name: Deploy to S3 + CloudFront
on:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Decide whether the site check runs
        # Run tools/site/check.js only when something it validates changed: pages, study content/generator,
        # shared chrome/bar files, the site tools, or this workflow. A deploy that only touches index.mjs,
        # admin-sw.js, images or docs skips it. index.mjs and tools/lambda/ count because check.js runs the Lambda route tests. A push with no usable "before" (new branch, force-push) runs it.
        id: gate
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git fetch -q --depth=1 origin "$BEFORE"; then
            echo "no usable base commit — running the check"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          echo "$CHANGED" | sed 's/^/  changed: /'
          if echo "$CHANGED" | grep -qE '^(study/|tools/study/|tools/site/|tools/lambda/|index\.mjs$|site-[a-z-]+\.(js|css)$|\.github/workflows/deploy\.yml$|[^/]+\.html$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing the site check validates changed — skipping it"; echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Site check (tools/site/check.js)
        # Static gate: pages, cache versions, course data, image sizes, course registry, Lambda route tests.
        # Fails the deploy before anything is uploaded.
        if: steps.gate.outputs.run == 'true'
        run: node tools/site/check.js
      - name: Generate print pages
        run: node --input-type=module < generate-prints.js
      - name: Stamp admin service-worker cache name from content
        # Any change to the admin shell gets a new cache automatically; no manual bump in admin-sw.js.
        run: |
          H=$(cat admin.html admin.webmanifest admin-sw.js | sha256sum | cut -c1-12)
          sed -i "s/dna-admin-[0-9a-z]*/dna-admin-$H/g" admin-sw.js
          grep -n "dna-admin-" admin-sw.js | head -2
      - name: Upload to S3
        run: |
          aws s3 sync . s3://kiosk.davidnicholsonllc \
            --exclude "*" \
            --include "*.html" \
            --include "prints/*.html" \
            --include "*.png" \
            --include "*.jpg" \
            --include "*.xml" \
            --include "*.txt" \
            --include "*.js" \
            --include "*.webmanifest" \
            --include "site-*.css" \
            --include "study/*.css" \
            --exclude "receipts/*" \
            --exclude "tools/study/edit-server.js" \
            --exclude "tools/study/editor/*" \
            --delete
      - name: No-cache headers for Jill's page
        # Browsers otherwise keep a stale copy for hours after a deploy (S3 sends no Cache-Control).
        # Plain upload from the checkout = same PutObject permission the sync above uses.
        run: |
          aws s3 cp expenses-jill-nicholson.html s3://kiosk.davidnicholsonllc/expenses-jill-nicholson.html \
            --cache-control "no-cache" \
            --content-type "text/html; charset=utf-8"
      - name: Deploy Lambda
        run: |
          zip lambda.zip index.mjs
          aws lambda update-function-code \
            --function-name dna-kiosk \
            --zip-file fileb://lambda.zip
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E31J8ASEUTGXD9 \
            --paths "/*"
          aws cloudfront create-invalidation \
            --distribution-id E2EJH38GWGPEPG \
            --paths "/*"
