function openLb(im){lbi.src=im.src;lbi.alt=im.alt;lbc.innerHTML=im.dataset.cap;lb.hidden=false;document.getElementById('lbx').focus()}
function closeLb(){lb.hidden=true;const im=document.querySelector('.pic img');im&&im.focus()}
function stepLb(d){let p=imgs.findIndex(i=>i>=cur);if(flat[cur].kind!=='work'){p=d>0?imgs.findIndex(i=>i>cur):imgs.length-1-[...imgs].reverse().findIndex(i=>i<cur)}else p+=d;if(p<0||p>=imgs.length)return;go(imgs[p]);const im=document.querySelector('.pic img');if(im){lbi.src=im.src;lbc.innerHTML=im.dataset.cap}}
lb.onclick=e=>{if(e.target===lb||e.target===lbi)closeLb()}; document.getElementById('lbx').onclick=closeLb;
document.getElementById('lbp').onclick=e=>{e.stopPropagation();stepLb(-1)}; document.getElementById('lbn').onclick=e=>{e.stopPropagation();stepLb(1)};
document.addEventListener('keydown',e=>{if(/SELECT|INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(!lb.hidden){if(e.key==='Escape')closeLb();if(e.key==='ArrowRight')stepLb(1);if(e.key==='ArrowLeft')stepLb(-1);return}
  if(e.key==='ArrowRight')go(cur+1); if(e.key==='ArrowLeft')go(cur-1)});
/* search */
const norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const textOf=f=>{const d=f.d||{};const parts=[];
  if(f.kind==='overview'){const o=d.overview;parts.push(d.title,d.sub,o.sum,...(o.bul||[]),...(o.terms||[]).flat(),...(o.cap||[]))}
  else if(f.kind==='intro'||f.kind==='credits'){parts.push(f.label)}
  else{parts.push(d.title,d.artist,d.date,d.det,d.fn,d.stmt,d.para,d.sum,d.sub,...(d.bul||[]),...(d.terms||[]).flat(),d.quote&&d.quote.q)}
  return parts.filter(Boolean).join(' · ')};
const IDX=flat.map((f,i)=>{const t=textOf(f),tt=(f.d&&f.d.title)||'';return {i,t,body:tt&&t.startsWith(tt+' · ')?t.slice(tt.length+3):t,n:norm(t),title:norm((f.d&&f.d.title)||f.label)+' '+norm(f.d&&f.d.artist)}});
const qi=document.getElementById('q'),rs=document.getElementById('results');let hits=[],sel=-1;
function snippet(t,words){const n=norm(t);let p=-1;for(const w of words){const k=n.indexOf(w);if(k>=0&&(p<0||k<p))p=k}
  let a=Math.max(0,p-50),b=Math.min(t.length,a+170);let s=t.slice(a,b);if(a>0)s='…'+s;if(b<t.length)s+='…';
  let h=esc(s);for(const w of words){if(!w)continue;const re=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');h=h.replace(re,'<mark>$1</mark>')}return h}
function kindLabel(f){const hd=S.handouts.find(x=>x.n===f.h);const k={overview:'Overview',theme:'Theme',intro:'Start',credits:'Credits'}[f.kind];return [hd&&hd.title,k].filter(Boolean).join(' · ')}
function thumbKey(f){if(f.kind==='work')return f.d.key;if(f.kind==='theme')return f.d.img;if(f.kind==='overview')return f.d.overview.img;return null}
function search(){const raw=qi.value.trim();if(!raw){rs.hidden=true;qi.setAttribute('aria-expanded','false');return}
  const words=norm(raw).split(/\s+/).filter(Boolean);
  hits=IDX.filter(x=>words.every(w=>x.n.includes(w))).map(x=>({...x,score:words.reduce((a,w)=>a+(x.title.includes(w)?5:0),0)})).sort((a,b)=>b.score-a.score||a.i-b.i).slice(0,40);
  sel=hits.length?0:-1;
  rs.innerHTML=hits.length?`<p class="rcount">${hits.length===40?'40+':hits.length} slide${hits.length===1?'':'s'}</p>`+hits.map((x,j)=>{const f=flat[x.i],k=thumbKey(f);
    return `<button class="res" role="option" data-j="${j}" aria-selected="${j===sel}">${k?`<img class="th" src="${src(k)}" alt="" loading="lazy">`:'<span class="ph">§</span>'}<span><span class="rk">${esc(kindLabel(f))}</span><span class="rt">${esc((f.d&&f.d.title)||f.label)}</span><span class="rs">${snippet(x.body,words)}</span></span></button>`}).join('')
    :`<p class="rnone">No slides match “${esc(raw)}”. Try a single name, such as Zeus or Pandora.</p>`;
  rs.hidden=false;qi.setAttribute('aria-expanded','true');
  rs.querySelectorAll('.res').forEach(b=>b.onclick=()=>pick(+b.dataset.j))}
function pick(j){if(!hits[j])return;go(hits[j].i);rs.hidden=true;qi.setAttribute('aria-expanded','false');document.getElementById('slide').focus?.()}
function mark(){rs.querySelectorAll('.res').forEach((b,j)=>{b.setAttribute('aria-selected',String(j===sel));if(j===sel)b.scrollIntoView({block:'nearest'})})}
qi.addEventListener('input',search);
qi.addEventListener('focus',()=>{if(qi.value.trim())search()});
qi.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();if(hits.length){sel=(sel+1)%hits.length;mark()}}
  else if(e.key==='ArrowUp'){e.preventDefault();if(hits.length){sel=(sel-1+hits.length)%hits.length;mark()}}
  else if(e.key==='Enter'){e.preventDefault();pick(sel)}
  else if(e.key==='Escape'){if(qi.value){qi.value='';search()}else qi.blur()}});
document.addEventListener('click',e=>{if(!document.getElementById('search').contains(e.target)){rs.hidden=true;qi.setAttribute('aria-expanded','false')}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)){e.preventDefault();qi.focus()}});
/* swipe */
(function(){let x0=null,y0=null,t0=0;
 function ts(e){if(e.touches.length!==1){x0=null;return}x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now()}
 function te(e,fn){if(x0==null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;if(Date.now()-t0>800)return;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)fn(dx<0?1:-1)}
 const sl=document.getElementById('slide');
 sl.addEventListener('touchstart',ts,{passive:true});sl.addEventListener('touchend',e=>te(e,d=>go(cur+d)),{passive:true});
 lb.addEventListener('touchstart',ts,{passive:true});lb.addEventListener('touchend',e=>te(e,d=>stepLb(d)),{passive:true});
})();
/* start */
const hs=(location.hash||'').slice(1); const st=flat.findIndex(f=>f.id===hs); go(st>=0?st:0);
})();
</script>
</body>
