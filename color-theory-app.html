<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>color theory deck — david nicholson</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="96x96" href="favicon96.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wall:#ffffff; --wall-hi:#f4f6f8; --ink:#2b3640; --muted:#586470;
    --line:#dfe4e9; --card:#ffffff; --chip-dark:#2b3640;
    --accent:#2f4f75; --accent-hi:#3d5f88;
    --display:'Jost',Futura,'Trebuchet MS',Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,'Segoe UI Mono',monospace;
    --body:'Jost',Futura,'Trebuchet MS',Arial,sans-serif;
    --shadow:0 1px 2px rgba(43,54,64,.08),0 18px 40px -14px rgba(43,54,64,.20);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:
      radial-gradient(120% 90% at 50% -10%,var(--wall-hi),var(--wall) 60%);
    color:var(--ink);font-family:var(--body);
    display:flex;flex-direction:column;min-height:100dvh;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- top bar ---- */
  header{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:20px clamp(16px,4vw,40px) 0;gap:16px;
  }
  .brand{font-family:var(--mono);font-size:12px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted)}
  .brand b{color:var(--ink);font-weight:500}
  .counter{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--muted)}
  .counter b{color:var(--ink);font-weight:500}

  /* ---- stage ---- */
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:12px clamp(16px,4vw,40px);gap:18px}
  .stage{width:min(560px,92vw);perspective:1800px}
  /* Card height is set per breakpoint rather than from a 5:3 ratio: the answer
     side carries a definition + a per-card explanation + a tip, which a 5:3 card
     is too short to hold once the viewport narrows. */
  .flip{position:relative;width:100%;height:360px;
    transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.7,.2,1);
    cursor:pointer}
  .flip.revealed{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:10px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
  .back{transform:rotateY(180deg)}
  .fade{height:100%;transition:opacity .16s ease}
  .fade.out{opacity:0}

  /* ---- front: pantone-style swatches ---- */
  .swatches{display:flex;width:100%;height:100%}
  .sw{position:relative;flex:1 1 0;min-width:0}          /* color = inline background */
  .sw+.sw .label::before{content:"";position:absolute;left:0;top:8px;bottom:8px;
    width:1px;background:#E4E0D6}
  .sw .label{position:absolute;left:0;right:0;bottom:0;height:34%;min-height:38px;background:#fff;
    display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;
    padding:6px 9px}
  .sw .nm{font-family:var(--display);font-weight:600;font-size:clamp(10.5px,2.9vw,13px);
    line-height:1.05;text-align:right;color:#1a1a1c;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sw .hx{font-family:var(--mono);font-size:clamp(8.5px,2.1vw,9.5px);color:#8b877e;margin-top:2px}
  .cardno{position:absolute;left:9px;bottom:7px;font-family:var(--mono);
    font-size:9px;color:#b4afa3;letter-spacing:.05em}

  /* ---- front: science ---- */
  .sci-front{width:100%;height:100%;background:var(--chip-dark);color:#F4F3F1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .sci-front .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;
    text-transform:uppercase;color:#7E828C}
  .sci-front .term{font-family:var(--display);font-weight:600;
    font-size:clamp(20px,5.4vw,30px);line-height:1.1;margin:16px 0 0;max-width:90%}

  /* ---- back ---- */
  .back-in{width:100%;height:100%;padding:clamp(16px,3.6vw,26px);display:flex;flex-direction:column;
    overflow-y:auto;-webkit-overflow-scrolling:touch}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  .rel{font-family:var(--display);font-weight:700;font-size:clamp(21px,5.4vw,30px);
    line-height:1.05;margin:4px 0 14px;letter-spacing:-.01em}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .chip{display:flex;flex-direction:column;align-items:center;gap:4px}
  .chip .sq{width:38px;height:38px;border-radius:5px;border:1px solid rgba(0,0,0,.12)}
  .chip .chx{font-family:var(--mono);font-size:9px;color:#57534c}
  .chip .cnm{font-family:var(--body);font-size:9px;color:#8b877e;max-width:56px;text-align:center;line-height:1.1}
  .defn{font-family:var(--body);font-weight:500;font-size:clamp(13.5px,3.5vw,15px);line-height:1.45;color:#1f2a33;margin:0}
  .explain{font-family:var(--body);font-size:clamp(13px,3.3vw,14px);line-height:1.5;color:#46525e;margin:8px 0 0}
  .tip{font-family:var(--body);font-style:italic;font-size:clamp(12.5px,3.1vw,13.5px);
    line-height:1.45;color:#4a5568;margin:10px 0 0}
  .meta{margin-top:auto;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
    color:#9a958a;text-transform:uppercase}

  .prompt{font-family:var(--body);font-size:14px;color:var(--muted);min-height:20px;text-align:center}
  .prompt b{color:var(--ink);font-weight:600}

  /* ---- controls ---- */
  .controls{display:flex;align-items:center;gap:14px}
  button{font-family:var(--body);cursor:pointer;border:1px solid var(--line);
    background:#fff;color:var(--ink);border-radius:999px;transition:transform .1s ease,background .15s ease,border-color .15s ease}
  button:hover{background:var(--wall-hi)}
  button:active{transform:translateY(1px)}
  .arrow{width:52px;height:52px;font-size:20px;display:grid;place-items:center;line-height:1}
  .primary{height:52px;padding:0 26px;font-size:15px;font-weight:600;
    background:var(--accent);color:#fff;border-color:var(--accent);min-width:150px}
  .primary:hover{background:var(--accent-hi)}
  button:focus-visible{outline:2px solid #4a4a4a;outline-offset:2px}

  /* ---- footer tools ---- */
  footer{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;
    padding:0 16px 22px}
  .tool{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    padding:8px 12px;color:var(--muted)}
  select.tool{background:#fff;-webkit-appearance:none;appearance:none;padding-right:26px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23726E66'/></svg>");
    background-repeat:no-repeat;background-position:right 10px center}
  .tool.on{color:var(--ink);border-color:var(--ink)}

  .score{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted)}
  .score b{color:var(--ink);font-weight:500}
  .choices{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
    width:min(560px,92vw);min-height:44px}
  .choice{font-family:var(--body);font-size:14px;padding:10px 16px;border:1px solid var(--line);
    background:#fff;color:var(--ink);border-radius:999px;cursor:pointer;
    transition:background .15s ease,border-color .15s ease,transform .1s ease}
  .choice:hover{background:var(--wall-hi)}
  .choice:active{transform:translateY(1px)}
  .choice:disabled{cursor:default}
  .choice.correct{background:#E7F1E4;border-color:#3FA535;color:#256b2a;font-weight:600}
  .choice.wrong{background:#F6E7E5;border-color:#C0392B;color:#9c2b20}
  .choice:focus-visible{outline:2px solid #4a4a4a;outline-offset:2px}

  /* ---- demo layouts (Itten contrasts / Albers interactions) ---- */
  .grounds{display:flex;width:100%;height:100%}
  .grounds .g{flex:1;display:flex;align-items:center;justify-content:center}
  .grounds .sample{width:44%;height:min(148px,24.3vw);border-radius:2px}
  .bands{display:flex;width:100%;height:100%}
  .bands>div{height:100%}
  .adj{display:flex;width:100%;height:100%}
  .adj>div{flex:1;height:100%}
  .afterimg{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  .fix{width:13px;height:13px;border-radius:50%;background:rgba(0,0,0,.55);
    box-shadow:0 0 0 2px rgba(255,255,255,.55)}
  .ai-hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;
    font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:rgba(255,255,255,.92)}
  .ai-back{display:flex;flex-direction:column;height:100%}
  .ai-field{flex:1;background:#fff;display:flex;align-items:center;justify-content:center}
  .ai-note{padding:11px clamp(14px,3vw,22px) 13px;font-family:var(--body);
    font-size:clamp(12.5px,3.1vw,13.5px);line-height:1.45;color:#2b2925}
  .ai-note b{font-family:var(--display);font-weight:600}

  /* Phones: the 5:3 card is too short for the answer text, so let it grow.
     The swatch fronts simply read as a taller rectangle, which is fine.
     Faces stay absolutely positioned so the 3D flip keeps working. */
  @media (max-width:900px){ .flip{height:385px} }
  @media (max-width:700px){
    .flip{height:400px}
    main{gap:14px;padding-top:6px}
  }
  @media (max-width:420px){
    .arrow{width:46px;height:46px}
    .primary{min-width:120px;padding:0 18px}
    .flip{height:420px}
  }
  @media (prefers-reduced-motion:reduce){
    .flip{transition:none}
    .fade{transition:none}
  }
</style>
</head>

  <header>
    <div class="brand"><b>color theory deck</b> &nbsp;/&nbsp; study</div>

    <button class="tool" id="order">In order</button>
    <button class="tool" id="hardmode" title="Type the answer instead of picking it">Hard Mode</button>
  </footer>

(green/blue/violet).","explain":"Yellow is a warm hue and Green is a cool one. Side by side, the warm appears to come forward and the cool to fall back.","tip":"Push warms forward and cools back to fake distance and form.","meta":"warm + cool  •  medium contrast"},{"n":136,"suit":"visual","concept":"Warm–Cool Contrast","swatches":[{"name":"Yellow","hex":"#E5CC56"},{"name":"Blue-Green","hex":"#56ADA0"}],"definition":"A warm hue (red/orange/yellow) set against a cool one (green/blue/violet).","explain":"Yellow is a warm hue and Blue-Green is a cool one. Side by side, the warm appears to come forward and the cool to fall back.","tip":"Push warms forward and cools back to fake distance and form.","meta":"warm + cool  •  medium contrast"},{"n":137,"suit":"visual","concept":"Warm–Cool Contrast","swatches":[{"name":"Yellow","hex":"#EFCB1E"},{"name":"Blue","hex":"#2E6DB4"}],"definition":"A warm hue (red/orange/yellow) set against a cool one (green/blue/violet).","explain":"Yellow is a warm hue and Blue is a cool one. Side by side, the warm appears to come forward and the cool to fall back.","tip":"Push warms forward and cools back to fake distance and form.","meta":"warm + cool  •  high contrast"},{"n":138,"suit":"visual","concept":"Warm–Cool Contrast","swatches":[{"name":"Yellow","hex":"#F6E283"},{"name":"Blue-Violet","hex":"#9C9CCF"}],"definition":"A warm hue (red/orange/yellow) set against a cool one (green/blue/violet).","explain":"Yellow is a warm hue and Blue-Violet is a cool one. Side by side, the warm appears to come forward and the cool to fall back.","tip":"Push warms forward and cools back to fake distance and form.","meta":"warm + cool  •  high contrast"},{"n":139,"suit":"science","term":"Additive Color (RGB)","body":"Mixing light. Red, green and blue light combine toward white — more light, brighter result. R+G = yellow, G+B = cyan, R+B = magenta, all three = white. Used by screens, projectors and stage lighting.","tip":"Paint does the opposite: pigments subtract light, so mixing darkens."},{"n":140,"suit":"science","term":"Subtractive Color (CMY / RYB)","body":"Mixing pigment or ink. Each layer absorbs (subtracts) wavelengths, so more mixing moves toward black or mud. Printing uses cyan-magenta-yellow plus black (K); traditional painting uses red-yellow-blue.","tip":"This is why your mixes get duller and darker as you add more colors."},{"n":141,"suit":"science","term":"Wavelength & the Spectrum","body":"Visible light spans about 380–700 nm. Long wavelengths look red (~700 nm), short look violet (~400 nm); green sits mid-spectrum (~550 nm) where the eye is most sensitive. A hue is roughly its dominant wavelength.","tip":"'Warm' long-wavelength light literally carries less energy than 'cool' violet."},{"n":142,"suit":"science","term":"Simultaneous Contrast","body":"A color's look changes with what surrounds it. The same gray reads lighter on black and darker on white; a hue pushes its neighbor toward the opposite. Josef Albers built a whole teaching method on this effect.","tip":"Judge every color in context on the canvas, never alone on the palette."},{"n":143,"suit":"science","term":"Metamerism","body":"Two colors can match under one light and clash under another, because different wavelength mixes can produce the same cone response. A mix matched at your studio window may look wrong under gallery LEDs.","tip":"Check your key mixes under the light the work will finally hang in."},{"n":144,"suit":"science","term":"Afterimage & Opponent Process","body":"Stare at red, look away, and you see a cyan-green ghost. Vision codes color in opposing pairs — red/green, blue/yellow, black/white. This is why complements feel 'complete' and why afterimages appear.","tip":"A tired eye literally supplies the complement — use it to plan vibration."},{"n":145,"suit":"science","term":"Trichromacy","body":"Human color vision runs on three cone types, most sensitive to long (red), medium (green) and short (blue) wavelengths. Every color you see is a ratio of their responses — which is why three primaries can imitate millions of colors.","tip":"Three well-chosen primaries plus white can mix most of what you need."},{"n":146,"suit":"science","term":"Gamut","body":"The full set of colors a medium can actually produce. The eye sees more than any screen or pigment set can reproduce; sRGB, CMYK and your palette each have limits.","tip":"Some brilliant on-screen colors simply can't be printed or mixed — plan around it."},{"n":147,"suit":"science","term":"Value & Chroma","body":"Munsell's three axes: hue (which color), value (light to dark) and chroma (intensity, dull to vivid). Value reads first and carries a composition.","tip":"Nail your values before fussing over hue — a photo in grayscale tells the truth."},{"n":148,"suit":"science","term":"Color Temperature","body":"Light itself has a temperature in Kelvin: ~2700K looks warm/orange (candle, tungsten), ~6500K looks cool/blue (overcast daylight). Note the reversal — low Kelvin is 'warm.' It shifts every local color in a scene.","tip":"Set your white balance mentally: know your light before you trust a color."}];

const CONTRAST_DEF = {
  "Contrast of Hue":"Several pure, undiluted hues placed side by side.",
  "Light\u2013Dark":"Light against dark \u2014 a difference of value, not of hue.",
  "Cold\u2013Warm":"A warm hue set against a cool one.",
  "Complementary":"Two hues from opposite sides of the wheel.",
  "Simultaneous":"One color forced to shift by whatever surrounds it.",
  "Saturation":"A vivid, intense color against a dull, muted one.",
  "Extension":"Two colors given deliberately unequal amounts of space."
};
const CONTRAST_EXPLAIN = {
  "Contrast of Hue":"Each swatch is a full-strength hue with nothing added. This is the loudest, most primitive contrast \u2014 the one children's toys and flags are built on.",
  "Light\u2013Dark":"These would still read as different if the color were drained out. Value is the contrast doing the work here, independent of which hues are used.",
  "Cold\u2013Warm":"The warm swatch appears to advance and the cool one to recede. Itten considered this the most useful contrast for creating depth on a flat surface.",
  "Complementary":"These two hues sit 180\u00b0 apart. Mixed together they cancel into gray; placed side by side they make each other look more intense.",
  "Simultaneous":"The gray square is the identical color on both sides \u2014 measure it and it hasn't changed. Each surround pushes it toward that surround's opposite.",
  "Saturation":"Both swatches are the same hue. One is at full intensity, the other dulled toward gray, so the pure one reads as louder by comparison.",
  "Extension":"Not about which hues, but how much of each. Yellow is far more luminous than violet, so a small amount balances a much larger area of it."
};
const CONTRAST_TIP = {
  "Contrast of Hue":"Strongest with the primaries; separate with black or white to organize it.",
  "Light\u2013Dark":"Squint \u2014 if the values don't separate, the design goes flat.",
  "Cold\u2013Warm":"The engine of depth: warms advance, cools recede.",
  "Complementary":"Mixed they gray out; side by side they vibrate.",
  "Simultaneous":"A gray never stays neutral next to a strong hue.",
  "Saturation":"One pure note reads loudest surrounded by muted tones.",
  "Extension":"Balance by area \u2014 a little yellow offsets a lot of violet (~1:3)."
};

  return Object.assign({kind:'contrast', group:'contrast', name,

}

const cardKind = c => c.kind ? c.kind : (c.suit==='science' ? 'science' : 'relationship');
const isMC = c => { const k=cardKind(c); return k==='relationship' || k==='contrast'; };
const answerOf = c => cardKind(c)==='contrast' ? c.name : c.concept;
const poolOf = c => cardKind(c)==='contrast' ? CONTRAST_NAMES : VISUAL_CONCEPTS;
const pad = n => String(n).padStart(3,'0');
const shuffleArr = a => { for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];} return a; };

/* Group key used to spread out repeats. For MC cards this is the answer itself
   (concept/contrast name); for flip-only cards (science, Albers) it's the kind. */
const groupKey = c => isMC(c) ? answerOf(c) : cardKind(c);

/* Round-robin deal by group, instead of a flat shuffle repaired only at
   adjacent collisions. Cards are bucketed by groupKey, each bucket shuffled
   internally, then one card is dealt from each non-empty bucket per "round" —
   with the bucket order itself reshuffled every round so the deal never
   settles into a predictable rotation. This guarantees no group can cluster
   (its repeat spacing is at minimum the number of buckets still in play),
   while staying genuinely random rather than mechanically periodic. */
function spread(arr){
  const bucketMap = new Map();
  arr.forEach(c => {
    const key = groupKey(c);
    if(!bucketMap.has(key)) bucketMap.set(key, []);
    bucketMap.get(key).push(c);
  });
  const buckets = [...bucketMap.values()].map(b => shuffleArr(b.slice()));
  const result = [];
  while (buckets.some(b => b.length)){
    const order = shuffleArr(buckets.map((_, idx) => idx).filter(idx => buckets[idx].length));
    for (const idx of order) result.push(buckets[idx].shift());
  }
  return result;
}

function swatchesFront(c){
  const cols = c.swatches.map(s => `
    <div class="sw" style="background:${s.hex}">
      <div class="label"><div class="nm">${s.name}</div><div class="hx">${s.hex}</div></div>
    </div>`).join('');
  return `<div class="swatches">${cols}<div class="cardno">${pad(c.n)}</div></div>`;
}
function groundsFront(sample, gA, gB){
  return `<div class="grounds">
    <div class="g" style="background:${gA}"><div class="sample" style="background:${sample}"></div></div>
    <div class="g" style="background:${gB}"><div class="sample" style="background:${sample}"></div></div>
  </div>`;
}
function bandsFront(bands){
  return `<div class="bands">${bands.map(b=>`<div style="flex:${b.frac};background:${b.hex}"></div>`).join('')}</div>`;
}
function adjFront(a, b){
  return `<div class="adj"><div style="background:${a}"></div><div style="background:${b}"></div></div>`;
}
function bezoldFront(mid){
  return `<div class="adj">
    <div style="background-color:${mid};background-image:repeating-linear-gradient(45deg,#fff 0 7px,transparent 7px 16px)"></div>
    <div style="background-color:${mid};background-image:repeating-linear-gradient(45deg,#000 0 7px,transparent 7px 16px)"></div>
  </div>`;
}
function afterimageFront(color){
  return `<div class="afterimg" style="background:${color}">
    <div class="fix"></div>
    <div class="ai-hint">Stare at the dot ~15s, then Reveal</div>
  </div>`;
}

function frontHTML(c){
  const k = cardKind(c);
  if(k === 'science'){
    return `<div class="sci-front"><div class="eyebrow">Color Science</div><div class="term">${c.term}</div></div>`;
  }
  if(k === 'albers'){
    if(c.layout === 'grounds') return groundsFront(c.sample, c.groundA, c.groundB);
    if(c.layout === 'adj')     return adjFront(c.a, c.b);
    if(c.layout === 'bezold')  return bezoldFront(c.mid);
    if(c.layout === 'afterimage') return afterimageFront(c.color);
    if(c.layout === 'bands3')  return bandsFront([{hex:c.a,frac:1},{hex:c.m,frac:1.25},{hex:c.b,frac:1}]);
  }
  if(k === 'contrast'){
    if(c.layout === 'grounds')    return groundsFront(c.sample, c.groundA, c.groundB);
    if(c.layout === 'proportion') return bandsFront(c.bands);
    return swatchesFront(c);
  }
  return swatchesFront(c);   // relationship
}

function chipsHTML(sw){
  return sw.map(s => `
    <div class="chip">
      <div class="sq" style="background:${s.hex}"></div>
      <div class="chx">${s.hex}</div>
      <div class="cnm">${s.name}</div>
    </div>`).join('');
}
function backHTML(c){
  const k = cardKind(c);
  if(k === 'science'){
    return `<div class="back-in">
      <div class="eyebrow">Color Science</div>
      <div class="rel">${c.term}</div>
      <p class="defn">${c.body}</p>
      <p class="tip">Tip: ${c.tip}</p>
    </div>`;
  }
  if(k === 'albers'){
    if(c.layout === 'afterimage'){
      return `<div class="ai-back">
        <div class="ai-field"><div class="fix"></div></div>
        <div class="ai-note"><b>Afterimage.</b> ${c.body}</div>
      </div>`;
    }
    return `<div class="back-in">
      <div class="eyebrow">Albers &middot; Interaction</div>
      <div class="rel">${c.name}</div>
      <p class="defn">${c.body}</p>
      <p class="tip">Tip: ${c.tip}</p>
    </div>`;
  }
  if(k === 'contrast'){
    const chips = c.swatches ? `<div class="chips">${chipsHTML(c.swatches)}</div>` : '';
    return `<div class="back-in">
      <div class="eyebrow">Itten &middot; Seven Contrasts</div>
      <div class="rel">${c.name}</div>
      ${chips}
      <p class="defn">${c.definition}</p>
      ${c.explain ? `<p class="explain">${c.explain}</p>` : ''}
      <p class="tip">Tip: ${c.tip}</p>
    </div>`;
  }
  return `<div class="back-in">
    <div class="eyebrow">Relationship</div>
    <div class="rel">${c.concept}</div>
    <div class="chips">${chipsHTML(c.swatches)}</div>
    <p class="defn">${c.definition}</p>
    ${c.explain ? `<p class="explain">${c.explain}</p>` : ''}
    <p class="tip">Tip: ${c.tip}</p>
    <div class="meta">${c.meta.replace(/•/g,'&middot;')}</div>
  </div>`;
}

function paint(){
  const c = work[i];
  frontIn.innerHTML = frontHTML(c);
  backIn.innerHTML = backHTML(c);
  pos.textContent = pad(i+1);
  totalEl.textContent = work.length;
  if(isMC(c) && !answered) curChoices = buildChoices(c);
  renderChoices();
  flip.classList.toggle('revealed', answered);
  updateChrome();
}

function buildChoices(card){
  const correct = answerOf(card);
  // 5 distractors + the correct answer = 6 options (up from 4), so recognizing
  // "one of the two I remember" isn't enough to guess right.
  const others = shuffleArr(poolOf(card).filter(x => x !== correct)).slice(0,5);
  return shuffleArr([correct, ...others]);
}

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const normalizeAns = s => s.toLowerCase().replace(/[\u2013\u2014-]/g,' ').replace(/[()]/g,'').replace(/\s+/g,' ').trim();

function renderChoices(){
  const c = work[i];
  if(!isMC(c) || answered){ choicesEl.style.display='none'; choicesEl.innerHTML=''; return; }
  choicesEl.style.display='flex';
  if (hardMode){
    choicesEl.innerHTML = `
      <input type="text" id="hardAnswer" class="choice" style="min-width:220px;flex:1 1 220px;text-align:center;cursor:text" placeholder="Type the answer…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="choice" id="hardSubmit">Submit</button>`;
    const inp = document.getElementById('hardAnswer');
    const submit = () => { if (inp.value.trim()) chooseFreeText(inp.value); };
    document.getElementById('hardSubmit').onclick = submit;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); submit(); } });
    inp.focus();
    return;
  }
  choicesEl.innerHTML = curChoices.map(o => `<button class="choice" data-c="${esc(o)}">${esc(o)}</button>`).join('');
  choicesEl.querySelectorAll('.choice').forEach(b => b.onclick = () => choose(b.dataset.c));
}

function choose(opt){
  if(answered) return;
  const c = work[i], correct = answerOf(c);
  answered = true; chosen = opt;
  score.attempted++; if(opt === correct) score.correct++;
  choicesEl.querySelectorAll('.choice').forEach(b => {
    b.disabled = true;
    if(b.dataset.c === correct) b.classList.add('correct');
    else if(b.dataset.c === opt) b.classList.add('wrong');
  });
  updateChrome();
  setTimeout(() => { choicesEl.style.display='none'; flip.classList.add('revealed'); updateChrome(); }, 750);
}

function chooseFreeText(raw){
  if(answered) return;
  const c = work[i], correct = answerOf(c);
  const isRight = normalizeAns(raw) === normalizeAns(correct);
  answered = true; chosen = isRight ? correct : raw;
  score.attempted++; if(isRight) score.correct++;
  choicesEl.innerHTML = `<div class="choice ${isRight?'correct':'wrong'}" style="cursor:default">${esc(raw)}${isRight ? '' : ' → ' + esc(correct)}</div>`;
  updateChrome();
  setTimeout(() => { choicesEl.style.display='none'; flip.classList.add('revealed'); updateChrome(); }, 900);
}

function reveal(){
  if(answered) return;
  answered = true;
  flip.classList.add('revealed');
  updateChrome();
}

function updateChrome(){
  const c = work[i], k = cardKind(c);
  scoreEl.textContent = `${score.correct}/${score.attempted}`;
  if(!answered){
    prompt.innerHTML =
      k === 'science'      ? 'What is it? <b>Reveal</b> for the answer.' :
      k === 'albers'       ? 'What do you notice? <b>Reveal</b> to explain.' :
      k === 'contrast'     ? 'Which contrast is this?' :
                             'Which relationship do these show?';
  } else if(isMC(c)){
    const correct = answerOf(c);
    prompt.innerHTML = chosen === correct
      ? '\u2713 Correct'
      : `Not quite \u2014 it\u2019s <b>${correct}</b>`;
  } else {
    prompt.innerHTML = '&nbsp;';
  }
  if(answered){ nextBtn.style.display=''; nextBtn.textContent = 'Next \u203A'; }
  else if(!isMC(c)){ nextBtn.style.display=''; nextBtn.textContent = 'Reveal'; }
  else { nextBtn.style.display='none'; }   // MC: must pick a choice
}

function advance(step){
  frontIn.classList.add('out'); backIn.classList.add('out'); choicesEl.style.opacity='0';
  setTimeout(()=>{
    i = (i + step + work.length) % work.length;
    flip.style.transition = 'none';
    answered = false; chosen = null;
    flip.classList.remove('revealed');
    void flip.offsetWidth;                 // force reflow
    flip.style.transition = '';
    choicesEl.style.opacity='';
    paint();
    frontIn.classList.remove('out'); backIn.classList.remove('out');
  }, 150);
}

function next(){
  const c = work[i];
  if(answered) advance(1);
  else if(!isMC(c)) reveal();
  // MC & unanswered: pick a choice first
}
function prev(){ advance(-1); }

$('#next').onclick = next;
$('#prev').onclick = prev;
$('#fwd').onclick = ()=>advance(1);
flip.onclick = ()=>{
  const c = work[i];
  if(answered) advance(1);
  else if(!isMC(c)) reveal();
};

document.addEventListener('keydown', e=>{
  const t = e.target.tagName;
  if(t === 'SELECT' || t === 'BUTTON') return;
  const c = work[i];
  if(e.key >= '1' && e.key <= '4'){
    if(isMC(c) && !answered){ const o = curChoices[+e.key-1]; if(o) choose(o); }
    return;
  }
  if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); prev(); }
  else if(e.key.toLowerCase()==='s'){ doShuffle(); }
});

/* ---- filter / order ---- */
const filter = $('#filter');
const opts = ['All cards', ...VISUAL_CONCEPTS, 'Itten contrasts', 'Albers interactions', 'Color science'];
filter.innerHTML = opts.map(o=>`<option>${o}</option>`).join('');

function setWork(){
  const v = filter.value;
  if(v==='All cards') work = CARDS.slice();
  else if(v==='Color science') work = CARDS.filter(c=>c.suit==='science');
  else if(v==='Itten contrasts') work = CARDS.filter(c=>cardKind(c)==='contrast');
  else if(v==='Albers interactions') work = CARDS.filter(c=>cardKind(c)==='albers');
  else work = CARDS.filter(c=>c.concept===v);
}
function reset(resetScore){
  if(resetScore) score = { correct:0, attempted:0 };
  i=0; answered=false; chosen=null; paint();
}
filter.onchange = ()=>{
  setWork();
  if($('#shuffle').classList.contains('on')) work = spread(work);
  reset(true);
};

/* ---- shuffle / order ---- */
function doShuffle(){
  work = spread(work);
  reset(false);
  $('#shuffle').classList.add('on'); $('#order').classList.remove('on');
}
$('#shuffle').onclick = doShuffle;
$('#order').onclick = ()=>{ setWork(); reset(false);
  $('#order').classList.add('on'); $('#shuffle').classList.remove('on'); };

/* Hard Mode: MC cards switch from tappable choices to a free-text answer,
   graded with light normalization (case, hyphen/en-dash, whitespace). */
$('#hardmode').onclick = () => {
  hardMode = !hardMode;
  $('#hardmode').classList.toggle('on', hardMode);
  if (!answered) renderChoices();
};

/* Deal shuffled by default — in generation order the deck runs concept-by-concept,
   which makes the answer guessable from position rather than from the swatches. */
doShuffle();
</script>
</body>
</html>
